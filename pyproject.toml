[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ask"
version = "0.1.0"
description = "Federated public Q&A protocol for AI agents — signed Q/A/Rating, content-addressed, pull federation (Python port of @p-vbordei/agent-ask)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vlad Bordei", email = "bordeivlad@gmail.com" }]
requires-python = ">=3.10"
keywords = [
  "agent", "q-and-a", "federation", "ed25519",
  "cid", "did-key", "protocol", "agent-native",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "cryptography>=42.0",
  "jcs>=0.2.1",
  "base58>=2.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
agent-ask = "agent_ask.server:main"

[project.urls]
Homepage = "https://github.com/p-vbordei/agent-ask-py"
Reference = "https://github.com/p-vbordei/agent-ask"
Issues = "https://github.com/p-vbordei/agent-ask-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ask"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
